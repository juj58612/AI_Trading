<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>使用者帳號管理 - AI概念股通用策略控制台</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { max-width: 800px; margin: 30px auto; }
        .admin-table { width: 100%; border-collapse: collapse; background-color: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); }
        .admin-table th { background-color: #1e3a8a; color: #f8fafc; padding: 12px; text-align: left; font-size: 0.9rem; }
        .admin-table td { padding: 12px; border-top: 1px solid var(--border-color); font-size: 0.9rem; }
        .admin-table tr:hover { background-color: rgba(59, 130, 246, 0.08); }
        .btn-reset { background-color: rgba(245, 158, 11, 0.15); border: 1px solid var(--accent-yellow); color: var(--accent-yellow); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; font-weight: bold; margin-right: 8px; }
        .btn-reset:hover { background-color: rgba(245, 158, 11, 0.3); }
        .btn-delete { background-color: rgba(239, 68, 68, 0.15); border: 1px solid var(--accent-green); color: var(--accent-green); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; font-weight: bold; }
        .btn-delete:hover { background-color: rgba(239, 68, 68, 0.3); }
        #adminMsg { text-align: center; margin: 15px 0; font-weight: bold; min-height: 1.2em; }
        .empty-msg { text-align: center; color: var(--text-sub); padding: 30px; }
    </style>
</head>
<body>

<div class="container admin-container">
    <header style="padding-bottom: 20px; border-bottom: 1px solid var(--border-color); text-align: center;">
        <h1>🔐 使用者帳號管理</h1>
        <p>僅限管理者查看：列出所有邀請碼自助註冊的帳號，可重設密碼或刪除帳號</p>
        <div style="margin-top: 12px;">
            <a href="index.html" style="color: var(--accent-blue); text-decoration: none; font-weight: bold;">← 回首頁</a>
        </div>
    </header>

    <div id="inviteCard" style="margin-top: 20px; background: linear-gradient(135deg, rgba(245,158,11,0.12) 0%, rgba(15,23,42,1) 100%); border: 1px solid var(--accent-yellow); border-radius: 12px; padding: 18px;">
        <div style="font-size: 1.1rem; font-weight: bold; color: var(--accent-yellow); margin-bottom: 10px;">✉️ 邀請朋友</div>
        <div style="display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 0.95rem;">
            <span style="color: var(--text-sub);">網址</span><span id="inviteUrl" style="word-break: break-all;">載入中…</span>
            <span style="color: var(--text-sub);">邀請碼</span><strong id="inviteCode" style="color: var(--accent-yellow); letter-spacing: 1px;">載入中…</strong>
        </div>
        <textarea id="inviteText" readonly rows="5" style="width: 100%; margin-top: 12px; background: #0f172a; color: var(--text-main); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; font-size: 0.9rem; resize: vertical;"></textarea>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px;">
            <button id="btnCopyInvite" onclick="copyInvite()" style="background: rgba(245,158,11,0.2); border: 1px solid var(--accent-yellow); color: var(--accent-yellow); padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer;">📋 複製邀請訊息</button>
            <span style="color: var(--text-sub); font-size: 0.82rem;">複製後直接貼到 LINE 或簡訊。要換邀請碼，請改 Render 後台與本機 .env 的 INVITATION_CODE。</span>
        </div>
    </div>

    <div id="adminMsg"></div>
    <div id="usersTableWrap"></div>
</div>

<script src="admin_users.js"></script>
<script src="top_nav.js"></script>
</body>
</html>
