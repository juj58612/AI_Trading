<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業級大數據分析中心</title>
    <link href="style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 15px; margin-bottom: 25px; }
        .btn-nav { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px; cursor: pointer; }
        .btn-nav:hover { background: #30363d; }
        
        .grid-layout { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        
        .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; }
        .panel h3 { margin-top: 0; color: #58a6ff; font-size: 16px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        
        /* Experiment List */
        .exp-list { max-height: 800px; overflow-y: auto; }
        .exp-card { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; }
        .exp-card:hover { border-color: #58a6ff; }
        .exp-card.active { border-color: #238636; box-shadow: 0 0 8px rgba(35,134,54,0.4); }
        .exp-title { font-weight: bold; font-size: 14px; margin-bottom: 5px; color: #f0f6fc; }
        .exp-meta { font-size: 12px; color: #8b949e; display: flex; justify-content: space-between; margin-bottom: 8px; }
        .exp-stats { display: flex; gap: 10px; font-size: 13px; }
        .stat-box { background: #21262d; padding: 4px 8px; border-radius: 4px; flex: 1; text-align: center; }
        .stat-box span { display: block; font-size: 11px; color: #8b949e; }
        .stat-box strong { color: #f0f6fc; }
        .profit-pos { color: #3fb950 !important; }
        .profit-neg { color: #f85149 !important; }
        
        /* Chart Area */
        .chart-container { height: 400px; margin-bottom: 20px; position: relative; }
        .trade-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .trade-table th { background: #21262d; text-align: left; padding: 8px; color: #8b949e; font-weight: normal; border-bottom: 1px solid #30363d; position: sticky; top: 0; }
        .trade-table td { padding: 8px; border-bottom: 1px solid #30363d; color: #c9d1d9; }
        .table-wrap { max-height: 350px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 style="margin:0; font-size: 24px;">📊 企業級大數據分析中心 (War Room)</h1>
            <div>
                <a href="backtest.html" class="btn-nav">🔙 回到回測實驗室</a>
                <a href="index.html" class="btn-nav">🏠 回到實戰主控台</a>
            </div>
        </div>

        <div class="grid-layout">
            <!-- Left: Experiment List -->
            <div class="panel">
                <h3>📜 歷史回測紀錄庫</h3>
                <div id="experimentList" class="exp-list">
                    <div style="text-align:center; padding:20px; color:#8b949e;">載入中...</div>
                </div>
            </div>

            <!-- Right: Analysis Center -->
            <div>
                <div class="panel" style="margin-bottom: 20px;">
                    <h3>🎯 MFE / MAE 散佈圖 (停損停利最佳化)</h3>
                    <div class="chart-container">
                        <canvas id="scatterChart"></canvas>
                    </div>
                    <div style="font-size:12px; color:#8b949e;">
                        * <b>MFE (最大潛在獲利)</b>: 交易期間最高價相比買進價的漲幅。<br>
                        * <b>MAE (最大潛在虧損)</b>: 交易期間最低價相比買進價的跌幅。
                    </div>
                </div>

                <div class="panel">
                    <h3>📝 交易節點明細</h3>
                    <div class="table-wrap">
                        <table class="trade-table" id="tradeTable">
                            <thead>
                                <tr>
                                    <th>股票</th>
                                    <th>買進日</th>
                                    <th>賣出日</th>
                                    <th>持倉天數</th>
                                    <th>獲利(%)</th>
                                    <th>MFE(%)</th>
                                    <th>MAE(%)</th>
                                    <th>出場原因</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr><td colspan="8" style="text-align:center;">請先在左側點選一筆實驗紀錄</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="analysis.js"></script>
</body>
</html>
